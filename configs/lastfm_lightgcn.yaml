# lightgcn on LastFM. L2 weight tuned on seed-0 validation, then reused for all seeds.
method: lightgcn
dataset: lastfm
data_dir: data/processed/lastfm
seeds: [0, 1, 2]
device: auto         # auto = cuda > mps > cpu; override with --device
dim: 64
n_layers: 3
lr: 0.001
batch_size: 2048
reg: 0.0001          # L2 weight on batch ego embeddings (overridden by tune)
max_epochs: 1500
eval_every: 5
patience: 10         # in evaluations
tune:
  seed: 0
  reg: [0.00001, 0.0001, 0.001]
save_checkpoint: true
