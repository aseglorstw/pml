# PU-GIB-RA-Est: RA-ranked candidates, estimated prior
# Paper protocol (bakhtrob.tex Sec. 3-4): cold start, Adam 1e-3, <= 800 epochs, early stopping on our
# validation NDCG@20 (patience 10 evaluations), social_form gbsr (joint normalization), tau over the budget.
# Datasets: --set dataset=<d> data_dir=data/processed/<d>; omega / omega_c come from LightGCN-S / LightGCN-PU.
name: paper_pugib_ra_est
dataset: lastfm
data_dir: data/processed/lastfm
seeds:
- 0
- 1
- 2
device: auto
dim: 64
n_layers: 3
lr: 0.001
batch_size: 2048
reg: 0.0001
init: random
init_std: 0.1
social_form: gbsr
max_epochs: 800
eval_every: 5
patience: 10
min_epochs: 0
eval_final: true
embedding_variant: best
method: pugib
pool: ra
prior: anchor
kappa: 0.05
beta: 0.001
omega_c: 0.25
social_omega: 1.0
tau_start: 1.0
tau_end: 0.2
tau_epochs: auto
masker_hidden: 64
hsic_lambda: 40
hsic_sigma: 2.5
