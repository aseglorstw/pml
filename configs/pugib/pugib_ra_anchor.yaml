# PU-GIB variant (generated by the step-3 config script). Tau annealed 1.0->0.2 over 100 epochs;
# early stopping is only allowed after min_epochs=100. Normalization is fixed by the main-variant
# selection via --set norm=... (see scripts/run_step3.sh).
name: pugib_ra_anchor
method: pugib
tau_start: 1.0
tau_end: 0.2
tau_epochs: 100
masker_hidden: 64
dataset: lastfm
data_dir: data/processed/lastfm
seeds:
- 0
- 1
- 2
device: auto         # auto = cuda > mps > cpu; override with --device
dim: 64
n_layers: 3
lr: 0.001
batch_size: 2048
reg: 0.0001
omega_s: 0.5
max_epochs: 1500
eval_every: 5
patience: 10
min_epochs: 100
embedding_variant: best
pool: ra
prior: anchor
norm: static
tune:
  seed: 0
  beta:
  - 0.01
  - 0.1
  - 1
  kappa:
  - 0.02
  - 0.05
  - 0.1
