# PU-GIB variant. Schedule: warm start, lr_emb 1e-4 (masker lr 1e-3), fixed 300-epoch budget with tau
# annealed 1.0 -> 0.2 over it, best val checkpoint kept. Pass norm/kappa/beta via --set (or the tune block).
name: pugib_s_en
method: pugib
tau_start: 1.0
tau_end: 0.2
tau_epochs: auto         # tau annealed over the whole budget
masker_hidden: 64
dataset: lastfm
data_dir: data/processed/lastfm
seeds:
- 0
- 1
- 2
device: auto         # auto = cuda > mps > cpu; override with --device
dim: 64
n_layers: 3
lr: 0.001
lr_emb: 0.0001           # embeddings (warm start); masker/other params use lr
eval_final: true         # also report last-epoch metrics
batch_size: 2048
reg: 0.0001
omega_s: 0.5
max_epochs: 300          # fixed budget (new schedule)
eval_every: 5
patience: 10
min_epochs: 300          # no early stop before the end; best val checkpoint is kept
embedding_variant: best
pool: s
prior: en
norm: static
tune:
  seed: 0
  beta:
  - 0.01
  - 0.1
  - 1
  kappa:
  - 0.02
  - 0.05
  - 0.1
